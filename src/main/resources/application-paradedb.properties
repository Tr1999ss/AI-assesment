# True BM25 keyword retrieval via ParadeDB pg_search (verified with paradedb/paradedb:0.21.0-pg16,
# which ships pgvector and pg_search together).
#
# 1. docker compose -f compose.paradedb.yaml up -d      (own container, port 5434, own volume)
# 2. docker compose up -d keycloak                       (if not already running)
# 3. run with --spring.profiles.active=paradedb
#
# A separate database, because an existing pgvector volume can't simply be switched to the ParadeDB
# image (its catalog references a different pgvector build). Re-ingest documents into it.

retrieval.keyword.engine=paradedb-bm25
spring.flyway.locations=classpath:db/migration,classpath:db/migration-paradedb
spring.datasource.url=jdbc:postgresql://localhost:5434/appdb
# the database is started manually (step 1); don't let Spring Boot start compose.yaml's pgvector db
spring.docker.compose.enabled=false
