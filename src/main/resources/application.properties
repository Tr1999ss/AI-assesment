spring.application.name=generic

server.port=9000


spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=openai/gpt-4o-mini
# OpenRouter also serves embeddings; 1536 dims matches spring.ai.vectorstore.pgvector.dimensions
spring.ai.openai.embedding.model=openai/text-embedding-3-small


# --- Docker Compose ---
spring.docker.compose.lifecycle-management=start_and_stop

spring.datasource.url=jdbc:postgresql://localhost:5433/appdb
spring.datasource.username=app
spring.datasource.password=secret

## turn off auto compose so there's one clear way things start
#spring.docker.compose.enabled=false

# --- Vector store ---
# Flyway owns the table (V5__vector_store_owned_by_flyway.sql); Spring AI must not create or alter it
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536
spring.flyway.placeholders.embedding_dimensions=${spring.ai.vectorstore.pgvector.dimensions}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
# health is public (load balancers, container checks); component details only for authenticated callers
management.endpoint.health.show-details=when-authorized

# --- Security: Keycloak (OAuth2 resource server) ---
# Local Keycloak from compose.yaml; override KEYCLOAK_ISSUER_URI for other environments.
# Keys are fetched lazily, so the app starts even if Keycloak is still booting.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/generic}
# tokens must be issued for this API (audience mapper on the generic-cli client)
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_AUDIENCE:generic-api}


# --- In-app docs viewer (GET /api/docs, see docs/docs-viewer.md) ---
# docs.enabled: serve readme.md + docs/** (copied onto the classpath by the build); false in the 'prod' profile
docs.enabled=true
# docs.public: true = no token needed. Keep false: the docs list dev credentials and the security setup.
# When false, the kb-reader role is required (same as search).
docs.public=false

# --- Logging: see what's sent to and from the LLM ---
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.com.shk.generic.ingestion.category=DEBUG

# --- Cap cost while experimenting ---
spring.ai.openai.chat.options.max-tokens=500
spring.ai.openai.chat.options.temperature=0.3

# --- Ingestion: intake ---
ingestion.intake.max-size=20MB
ingestion.intake.allowed-formats=PDF,MARKDOWN,JSON,TEXT
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# --- Flyway ---
# baseline so Flyway accepts the existing schema (vector_store) on first run; V1+ still apply
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Ingestion: categories ---
ingestion.category.fallback=general
ingestion.category.primary-min-confidence=0.5
ingestion.category.overlap-min-confidence=0.6
ingestion.category.max-overlaps=3
ingestion.category.excerpt-chars=3000

# --- Categories (shared by ingestion, retrieval, admin) ---
# admin API changes refresh the cache immediately on this instance; other instances within this TTL
category.registry.cache-ttl=60s

# --- Ingestion: chunking ---
ingestion.chunk.chunk-size-tokens=512
ingestion.chunk.min-chunk-size-chars=200
ingestion.chunk.min-chunk-length-to-embed=5
ingestion.chunk.max-chunks-per-document=2000

# --- Ingestion: storage ---
# PENDING claims older than stale-after are treated as abandoned (crash mid-ingestion) and cleaned up
ingestion.store.stale-after=15m
ingestion.store.sweep-interval=5m
ingestion.store.sweep-batch-size=100

# --- Retrieval ---
retrieval.default-top-k=5
retrieval.max-top-k=20
# cosine similarity floor; text-embedding-3-small: relevant ~0.45+, unrelated < 0.25
retrieval.default-min-score=0.25
retrieval.max-query-chars=2000
retrieval.max-context-chars=12000
retrieval.answer-temperature=0.2

# --- Retrieval toolkit: defaults (requests override per call; see GET /api/search/modes) ---
# Keep plain semantic search as the default until evaluation numbers justify a change
# (POST /api/admin/evaluation compares every configuration against this baseline).
retrieval.default-mode=semantic
retrieval.default-query-transform=none
retrieval.default-rerank=none
retrieval.default-diversify=none
# candidate pool when fusion/rerank/MMR is active (plain semantic retrieves exactly topK)
retrieval.default-candidates=30
# hard per-request limits
retrieval.max-candidates=100
retrieval.max-llm-calls-per-request=6
retrieval.llm-timeout=15s

# keyword engine: postgres-fts (built in) | paradedb-bm25 (needs the 'paradedb' profile, see application-paradedb.properties)
retrieval.keyword.engine=postgres-fts
# floor in the engine's own scale; 0 = any lexical match
retrieval.keyword.min-score=0.0
retrieval.fusion.rrf-k=60
retrieval.mmr.lambda=0.7
retrieval.transform.multi-query-variants=3
retrieval.transform.max-multi-query-variants=5
retrieval.transform.hyde-max-chars=800
retrieval.transform.rewrite-max-chars=300

# rerankers: LLM uses the configured chat model; COHERE and CROSS_ENCODER are enabled only when configured.
# Keys come from the environment only; they are never logged or returned.
retrieval.rerank.timeout=10s
retrieval.rerank.llm.batch-size=10
retrieval.rerank.llm.max-chars-per-candidate=600
retrieval.rerank.cohere.api-key=${COHERE_API_KEY:}
retrieval.rerank.cohere.model=rerank-v3.5
retrieval.rerank.cohere.base-url=https://api.cohere.com
# Hugging Face TEI-compatible /rerank endpoint, e.g. http://localhost:8082 serving BAAI/bge-reranker-v2-m3
retrieval.rerank.cross-encoder.url=${CROSS_ENCODER_URL:}
retrieval.rerank.cross-encoder.api-key=${CROSS_ENCODER_API_KEY:}
