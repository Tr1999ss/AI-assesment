spring.application.name=generic

server.port=9000


spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=openai/gpt-4o-mini
# OpenRouter also serves embeddings; 1536 dims matches spring.ai.vectorstore.pgvector.dimensions
spring.ai.openai.embedding.model=openai/text-embedding-3-small


# --- Docker Compose ---
spring.docker.compose.lifecycle-management=start_and_stop

spring.datasource.url=jdbc:postgresql://localhost:5433/appdb
spring.datasource.username=app
spring.datasource.password=secret

## turn off auto compose so there's one clear way things start
#spring.docker.compose.enabled=false

# --- Vector store ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# --- Logging: see what's sent to and from the LLM ---
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.com.shk.generic.ingestion.category=DEBUG

# --- Cap cost while experimenting ---
spring.ai.openai.chat.options.max-tokens=500
spring.ai.openai.chat.options.temperature=0.3

# --- Ingestion: intake ---
ingestion.intake.max-size=20MB
ingestion.intake.allowed-formats=PDF,MARKDOWN,JSON,TEXT
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# --- Flyway ---
# baseline so Flyway accepts the existing schema (vector_store) on first run; V1+ still apply
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Ingestion: categories ---
ingestion.category.fallback=general
ingestion.category.primary-min-confidence=0.5
ingestion.category.overlap-min-confidence=0.6
ingestion.category.max-overlaps=3
ingestion.category.excerpt-chars=3000

# --- Categories (shared by ingestion, retrieval, admin) ---
# admin API changes refresh the cache immediately on this instance; other instances within this TTL
category.registry.cache-ttl=60s

# --- Ingestion: chunking ---
ingestion.chunk.chunk-size-tokens=512
ingestion.chunk.min-chunk-size-chars=200
ingestion.chunk.min-chunk-length-to-embed=5
ingestion.chunk.max-chunks-per-document=2000

# --- Ingestion: storage ---
# PENDING claims older than stale-after are treated as abandoned (crash mid-ingestion) and cleaned up
ingestion.store.stale-after=15m
ingestion.store.sweep-interval=5m
ingestion.store.sweep-batch-size=100

# --- Retrieval ---
retrieval.default-top-k=5
retrieval.max-top-k=20
# cosine similarity floor; text-embedding-3-small: relevant ~0.45+, unrelated < 0.25
retrieval.default-min-score=0.25
retrieval.max-query-chars=2000
retrieval.max-context-chars=12000
retrieval.answer-temperature=0.2

# --- Admin API ---
# requests under /api/admin/ need header X-Admin-Api-Key; unset = admin API disabled (403)
admin.api-key=${ADMIN_API_KEY:}
